    <script>
      (()=>{const OLD_BRAND=/PsicoGest(?:ã|a)o/gi;const replaceBrand=value=>String(value||'').replace(OLD_BRAND,'Painel Administrativo');const neutralizeBrand=(root=document)=>{const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){if(OLD_BRAND.test(node.nodeValue||''))node.nodeValue=replaceBrand(node.nodeValue);OLD_BRAND.lastIndex=0}if(OLD_BRAND.test(document.title))document.title=replaceBrand(document.title);OLD_BRAND.lastIndex=0};const start=()=>{neutralizeBrand(document);new MutationObserver(mutations=>{for(const mutation of mutations)mutation.addedNodes.forEach(node=>{if(node.nodeType===Node.TEXT_NODE){if(OLD_BRAND.test(node.nodeValue||''))node.nodeValue=replaceBrand(node.nodeValue);OLD_BRAND.lastIndex=0}else if(node.nodeType===Node.ELEMENT_NODE)neutralizeBrand(node)})}).observe(document.documentElement,{childList:true,subtree:true})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();
    </script>
    <script>
      (()=>{const TITLE='Como funcionam o pagamento, o cancelamento e o reagendamento?';const COMM_TITLE='Como serei informado sobre meu agendamento e possíveis alterações?';const COMM_HTML=`<summary>${COMM_TITLE}</summary><div class="consumer-policy-answer"><p>O paciente receberá comunicações via e-mail sobre o andamento de seu atendimento e também pode acompanhar as informações atualizadas pelo Portal do Paciente.</p><p>As comunicações podem incluir a realização da reserva, a confirmação do pagamento e do agendamento, lembretes relacionados ao prazo de pagamento e à sessão, além de avisos sobre reagendamentos, cancelamentos ou alterações realizadas pela profissional.</p><p>Quando uma reserva não for confirmada por pagamento dentro do prazo, o paciente também poderá ser informado sobre o cancelamento da reserva e a liberação do horário.</p><p>Por isso, é importante manter o endereço de e-mail cadastrado corretamente e consultar o Portal do Paciente para acompanhar o status mais recente da sessão.</p></div>`;const installPolicyFaq=()=>{if(location.pathname!=='/')return;const grid=document.querySelector('#duvidas .faq-grid');if(!grid)return;if(!document.querySelector('[data-consumer-policy-faq="1"]')){const item=document.createElement('details');item.dataset.consumerPolicyFaq='1';item.innerHTML=`<summary>${TITLE}</summary><div class="consumer-policy-answer"><p><strong>Pagamento e confirmação:</strong> A sessão será considerada <strong>confirmada</strong> mediante a confirmação de pagamento, que deverá ser feito em até 24 horas antes do horário da sessão.<br>Sem a confirmação do pagamento até esse limite, a reserva poderá ser cancelada e o horário liberado.</p><p><strong>Reagendamento:</strong> O paciente poderá solicitar o reagendamento da sessão confirmada pelo portal até 24 horas antes do horário da sessão, conforme a disponibilidade de horários.</p><p><strong>Cancelamento e direitos do consumidor:</strong> Estas regras não afastam direitos assegurados pela legislação aplicável. Nas contratações realizadas pela internet, serão respeitados os direitos previstos no Código de Defesa do Consumidor, inclusive o direito de arrependimento quando aplicável à situação concreta. Se o cancelamento decorrer de iniciativa da profissional ou de impossibilidade de prestação do serviço, o paciente poderá optar pelo reagendamento ou pela restituição do valor pago.</p><p><strong>Transparência:</strong> os prazos e as condições de pagamento, confirmação, cancelamento e reagendamento são apresentados previamente para que o paciente possa conhecê-los antes da contratação.</p></div>`;const existing=[...grid.querySelectorAll('details')].find(el=>el.querySelector('summary')?.textContent?.includes('cancelar ou remarcar'));if(existing)existing.insertAdjacentElement('afterend',item);else grid.appendChild(item)}let comm=document.querySelector('[data-appointment-communication-faq="1"]');if(!comm){comm=document.createElement('details');comm.dataset.appointmentCommunicationFaq='1';const policy=document.querySelector('[data-consumer-policy-faq="1"]');if(policy)policy.insertAdjacentElement('afterend',comm);else grid.appendChild(comm)}if(comm.innerHTML!==COMM_HTML)comm.innerHTML=COMM_HTML};const start=()=>{installPolicyFaq();const root=document.getElementById('root');if(root)new MutationObserver(installPolicyFaq).observe(root,{childList:true,subtree:true})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();
    </script>
