name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://site-psicologa.thiagodrn2.workers.dev"
          HTML="$(curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL/?deploy=${GITHUB_SHA}")"

          mapfile -t JS_ASSETS < <(printf '%s' "$HTML" | grep -oE '/assets/[^"'"'"']+\.js' | sort -u)

          if [ "${#JS_ASSETS[@]}" -eq 0 ]; then
            echo "No JavaScript assets found in production HTML."
            exit 1
          fi

          FOUND=0
          TMP_FILE="$(mktemp)"
          trap 'rm -f "$TMP_FILE"' EXIT

          for ASSET in "${JS_ASSETS[@]}"; do
            curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL$ASSET" -o "$TMP_FILE"
            if grep -Fq "Atendimento psicológico individual com ética, acolhimento e respeito." "$TMP_FILE"; then
              FOUND=1
              break
            fi
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "Updated hero text was not found in the production bundle."
            exit 1
          fi

          echo "Production verification passed: updated hero text found."
