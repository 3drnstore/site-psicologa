name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://site-psicologa.thiagodrn2.workers.dev"

          EXPECTED_JS="$(grep -oE '/assets/[^"'"'"']+\.js' dist/index.html | head -n 1)"
          if [ -z "$EXPECTED_JS" ]; then
            echo "Expected JavaScript asset not found in local build."
            exit 1
          fi

          HTML_FILE="$(mktemp)"
          trap 'rm -f "$HTML_FILE"' EXIT

          FOUND_CURRENT=0
          for ATTEMPT in $(seq 1 20); do
            curl -fsSL "$BASE_URL/?deploy=${GITHUB_SHA}&attempt=${ATTEMPT}" -o "$HTML_FILE"
            if grep -Fq "$EXPECTED_JS" "$HTML_FILE"; then
              FOUND_CURRENT=1
              break
            fi
            echo "Waiting for current deployment to reach production (attempt $ATTEMPT/20)..."
            sleep 2
          done

          if [ "$FOUND_CURRENT" -ne 1 ]; then
            echo "Production HTML did not switch to expected asset: $EXPECTED_JS"
            exit 1
          fi

          curl -fsSL "$BASE_URL$EXPECTED_JS" -o /dev/null

          HEALTH="$(curl -fsSL "$BASE_URL/api/health?db=1")"
          printf '%s' "$HEALTH" | grep -Fq '"ok":true'
          printf '%s' "$HEALTH" | grep -Fq '"database":"online"'

          echo "Production verification passed: current asset and API health are live."
