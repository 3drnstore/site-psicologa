name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://site-psicologa.thiagodrn2.workers.dev"

          EXPECTED_JS="$(grep -oE '/assets/[^"'"'"']+\.js' dist/index.html | head -n 1)"
          if [ -z "$EXPECTED_JS" ]; then
            echo "Expected JavaScript asset not found in local build."
            exit 1
          fi

          HTML_FILE="$(mktemp)"
          BUNDLE_FILE="$(mktemp)"
          trap 'rm -f "$HTML_FILE" "$BUNDLE_FILE"' EXIT

          FOUND_CURRENT=0
          for ATTEMPT in $(seq 1 20); do
            curl -fsSL "$BASE_URL/?deploy=${GITHUB_SHA}&attempt=${ATTEMPT}" -o "$HTML_FILE"
            if grep -Fq "$EXPECTED_JS" "$HTML_FILE"; then
              FOUND_CURRENT=1
              break
            fi
            echo "Waiting for current deployment to reach production (attempt $ATTEMPT/20)..."
            sleep 2
          done

          if [ "$FOUND_CURRENT" -ne 1 ]; then
            echo "Production HTML did not switch to expected asset: $EXPECTED_JS"
            exit 1
          fi

          curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL$EXPECTED_JS" -o "$BUNDLE_FILE"

          REQUIRED_TEXTS=(
            "Atendimento psicológico individual com ética, acolhimento e respeito."
            "Sessões exclusivamente online, com privacidade e segurança."
            "Formada em Psicologia desde 2020"
            "Como funcionam as sessões"
            "Atendimento clínico individual"
            "A primeira sessão é um momento inicial de acolhimento e compreensão da demanda."
            "As informações compartilhadas durante as sessões são tratadas com confidencialidade, respeito e responsabilidade."
          )

          for TEXT in "${REQUIRED_TEXTS[@]}"; do
            if ! grep -Fq "$TEXT" "$BUNDLE_FILE"; then
              echo "Required production text not found: $TEXT"
              exit 1
            fi
          done

          FORBIDDEN_TEXTS=(
            "Consultório de Psicologia"
            "Atendimento On-line"
            "Limpeza temporária do histórico"
            "Remover meu histórico de sessões"
          )

          for TEXT in "${FORBIDDEN_TEXTS[@]}"; do
            if grep -Fq "$TEXT" "$BUNDLE_FILE"; then
              echo "Forbidden production text is still present: $TEXT"
              exit 1
            fi
          done

          echo "Production verification passed on the current deployed asset."
