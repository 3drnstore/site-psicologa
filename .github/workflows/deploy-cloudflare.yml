name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://site-psicologa.thiagodrn2.workers.dev"
          HTML="$(curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL/?deploy=${GITHUB_SHA}")"

          mapfile -t JS_ASSETS < <(printf '%s' "$HTML" | grep -oE '/assets/[^"'"'"']+\.js' | sort -u)

          if [ "${#JS_ASSETS[@]}" -eq 0 ]; then
            echo "No JavaScript assets found in production HTML."
            exit 1
          fi

          BUNDLE_FILE="$(mktemp)"
          ASSET_FILE="$(mktemp)"
          trap 'rm -f "$BUNDLE_FILE" "$ASSET_FILE"' EXIT

          for ASSET in "${JS_ASSETS[@]}"; do
            curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL$ASSET" -o "$ASSET_FILE"
            cat "$ASSET_FILE" >> "$BUNDLE_FILE"
          done

          REQUIRED_TEXTS=(
            "Atendimento psicológico individual com ética, acolhimento e respeito."
            "Sessões exclusivamente online, com privacidade e segurança."
            "Formada em Psicologia desde 2020"
            "Como funcionam as sessões"
            "Atendimento clínico individual"
            "A primeira sessão é um momento inicial de acolhimento e compreensão da demanda."
            "As informações compartilhadas durante as sessões são tratadas com confidencialidade, respeito e responsabilidade."
          )

          for TEXT in "${REQUIRED_TEXTS[@]}"; do
            if ! grep -Fq "$TEXT" "$BUNDLE_FILE"; then
              echo "Required production text not found: $TEXT"
              exit 1
            fi
          done

          FORBIDDEN_TEXTS=(
            "Consultório de Psicologia"
            "Atendimento On-line"
          )

          for TEXT in "${FORBIDDEN_TEXTS[@]}"; do
            if grep -Fq "$TEXT" "$BUNDLE_FILE"; then
              echo "Old production text is still present: $TEXT"
              exit 1
            fi
          done

          echo "Production verification passed for requested homepage copy."
