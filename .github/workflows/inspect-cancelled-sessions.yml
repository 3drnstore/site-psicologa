name: Inspect cancelled sessions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-cancelled-sessions.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Inspect target cancelled sessions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute site-psicologa-db --remote --yes --command "SELECT a.id,a.status,p.full_name,p.email,av.starts_at FROM appointments a JOIN patients p ON p.id=a.patient_id JOIN availability av ON av.id=a.availability_id WHERE a.status='cancelled' AND strftime('%Y-%m-%d %H:%M',av.starts_at,'-3 hours') IN ('2026-09-11 10:00','2026-09-11 11:00','2026-09-12 12:00') ORDER BY av.starts_at;"
