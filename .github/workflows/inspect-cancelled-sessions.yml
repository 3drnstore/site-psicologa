name: Delete target cancelled sessions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-cancelled-sessions.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Delete three cancelled session records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute site-psicologa-db --remote --yes --command "
          UPDATE clinical_notes SET appointment_id=NULL,updated_at=CURRENT_TIMESTAMP WHERE appointment_id IN (31,32,37);
          UPDATE patient_recurrence SET source_appointment_id=NULL,updated_at=CURRENT_TIMESTAMP WHERE source_appointment_id IN (31,32,37);
          UPDATE appointments SET recurrence_parent_appointment_id=NULL,updated_at=CURRENT_TIMESTAMP WHERE recurrence_parent_appointment_id IN (31,32,37);
          DELETE FROM appointment_changes WHERE appointment_id IN (31,32,37);
          DELETE FROM patient_notifications WHERE appointment_id IN (31,32,37);
          DELETE FROM payments WHERE appointment_id IN (31,32,37);
          DELETE FROM receita_saude_receipts WHERE appointment_id IN (31,32,37);
          DELETE FROM appointments WHERE id IN (31,32,37) AND status='cancelled';
          SELECT COUNT(*) AS remaining_target_sessions FROM appointments WHERE id IN (31,32,37);
          "
